[workspace]
resolver = "2"
members = ["crates/echo-core", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
log = "0.4"
thiserror = "2"
